[project]
name = "review-manager-mon"
version = "0.1.0"
description = "Batch crawler for Coupang orders"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
crawl-coupang = "review_manager_mon.cli.crawl_coupang:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
